name: PYPY SaaS CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Gateway Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./core
          file: ./core/gateway/Dockerfile
          push: true
          tags: pypygrid/gateway:latest

      - name: Push Dashboard Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: pypygrid/dashboard:latest

      - name: Deploy to Kubernetes Cluster
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Apply Manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/dashboard-deployment.yaml
          kubectl apply -f k8s/gateway-deployment.yaml
          kubectl apply -f k8s/digital-twin-deployment.yaml
          kubectl apply -f k8s/worker-deployment.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Rollout Restart Deployment
        run: |
          kubectl rollout restart deployment/gateway-deployment
          kubectl rollout restart deployment/dashboard-deployment
          kubectl rollout restart deployment/worker-deployment
