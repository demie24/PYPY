name: PYPY SaaS CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      mqtt:
        image: eclipse-mosquitto:latest
        ports:
          - 1883:1883
        options: >-
          --health-cmd="mosquitto_sub -h localhost -t test -C 1 -E"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements.txt -r core/requirements-ai.txt
          pip install pytest pytest-cov flake8 mock anyio typeguard
          pip install -e .

      - name: Lint Python Code (Syntax Check)
        run: |
          flake8 core --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Test Suite
        run: |
          pytest --tb=short --cov=core --cov-report=xml
        env:
          MQTT_BROKER: localhost
          MQTT_PORT: 1883

  dashboard-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Build Dashboard Frontend
        run: |
          cd dashboard
          npm ci || npm install
          npm run build

  docker-validate:
    runs-on: ubuntu-latest
    needs: [lint-and-test, dashboard-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config > /dev/null
          echo "✅ docker-compose.yml is valid"

      - name: Build Gateway Image
        run: |
          docker build -t pypygrid/gateway:latest -f core/gateway/Dockerfile core/

      - name: Build Dashboard Image
        run: |
          docker build -t pypygrid/dashboard:latest -f dashboard/Dockerfile dashboard/
