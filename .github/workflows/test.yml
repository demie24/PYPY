name: PYPY Test Pipeline

on:
  push:
    branches:
      - main
      - develop
      - repo-cleanup
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mqtt:
        image: eclipse-mosquitto:latest
        ports:
          - 1883:1883
        options: >-
          --health-cmd="mosquitto_sub -h localhost -t test -C 1 -E"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r core/requirements.txt -r core/requirements-ai.txt
        pip install pytest pytest-cov flake8
    - name: Install Package (editable)
      run: pip install -e .

    - name: Lint with flake8 (syntax errors only)
      continue-on-error: true
      run: |
        pip install flake8
        # Fail on Python syntax errors or undefined names
        flake8 core --count --select=E9,F63,F7,F82 --show-source --statistics
        # Treat style warnings as info only (exit-zero)
        flake8 core --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Unit Tests
      run: |
        pytest tests/unit/ -v --tb=short --cov=core --cov-report=xml

    - name: Run Non-Integration Tests
      run: |
        pytest tests/ -m "not integration" --tb=short --ignore=tests/unit
      env:
        MQTT_BROKER: localhost
        MQTT_PORT: 1883

    - name: Upload Coverage Report
      uses: codecov/codecov-action@v3
      continue-on-error: true
      with:
        file: ./coverage.xml
        flags: unittests
        name: pypy-coverage

  docker-validate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Validate docker-compose syntax
      run: |
        docker-compose config > /dev/null
        echo "✅ docker-compose.yml is valid"

    - name: Build Docker images (main branch only)
      run: docker-compose build
