version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_grid_postgres_prod
    environment:
      POSTGRES_DB: pypy_saas
      POSTGRES_USER: pypy_admin
      POSTGRES_PASSWORD: pypy_db_secure_password
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pypy_admin -d pypy_saas"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - grid-net-prod

  redis:
    image: redis:7-alpine
    container_name: smart_grid_redis_prod
    networks:
      - grid-net-prod

  mqtt:
    image: eclipse-mosquitto:latest
    container_name: smart_grid_mqtt_prod
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data_prod:/mosquitto/data
      - mqtt_logs_prod:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - grid-net-prod

  gateway:
    build:
      context: ./core
      dockerfile: ./gateway/Dockerfile
    container_name: smart_grid_gateway_prod
    environment:
      - DATABASE_URL=postgresql://pypy_admin:pypy_db_secure_password@postgres:5432/pypy_saas
      - REDIS_URL=redis://redis:6379/0
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - EMAIL_PROVIDER=smtp
      - SMTP_HOST=localhost
      - SMTP_PORT=1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mqtt:
        condition: service_healthy
    restart: always
    networks:
      - grid-net-prod
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery_worker:
    build:
      context: ./core
      dockerfile: ./gateway/Dockerfile
    container_name: smart_grid_celery_worker_prod
    command: celery -A workers.simulation.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://pypy_admin:pypy_db_secure_password@postgres:5432/pypy_saas
      - REDIS_URL=redis://redis:6379/0
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - grid-net-prod
    healthcheck:
      test: ["CMD", "celery", "-A", "workers.simulation.tasks", "inspect", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery_beat:
    build:
      context: ./core
      dockerfile: ./gateway/Dockerfile
    container_name: smart_grid_celery_beat_prod
    command: celery -A workers.billing.tasks beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://pypy_admin:pypy_db_secure_password@postgres:5432/pypy_saas
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - grid-net-prod
    healthcheck:
      test: ["CMD", "python", "-c", "import psutil, os, sys; sys.exit(0 if any('beat' in ' '.join(p.cmdline()) for p in psutil.process_iter() if p.pid != os.getpid()) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3

  digital_twin:
    build:
      context: ./core
      dockerfile: ./digital_twin/Dockerfile
    container_name: smart_grid_digital_twin_prod
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - LOG_LEVEL=INFO
    depends_on:
      mqtt:
        condition: service_healthy
    restart: always
    networks:
      - grid-net-prod

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ./Dockerfile
    container_name: smart_grid_dashboard_prod
    depends_on:
      - gateway
    restart: always
    networks:
      - grid-net-prod

  nginx:
    image: nginx:alpine
    container_name: smart_grid_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - dashboard
      - gateway
    restart: always
    networks:
      - grid-net-prod

networks:
  grid-net-prod:
    driver: bridge

volumes:
  pgdata_prod:
  mqtt_data_prod:
  mqtt_logs_prod:
