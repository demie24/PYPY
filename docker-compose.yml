
services:

  # ═══════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: smart_grid_mqtt
    ports:
      - "1884:1883"
      - "9001:9001"
     # External host access uses port 1884
     # Internal container communication remains on 1883 
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    restart: always
    networks:
      - grid-net
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "test", "-C", "1", "-E"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════
  # ACTIVE CORE SERVICES
  # ═══════════════════════════════════════
  gateway:
    build:
      context: ./core
      dockerfile: ./gateway/Dockerfile
    container_name: smart_grid_gateway
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - LOG_LEVEL=INFO
    depends_on:
      mqtt:
        condition: service_healthy
    restart: always
    networks:
      - grid-net
    volumes:
      - ./logs/gateway:/app/logs

  digital_twin:
    build:
      context: ./core
      dockerfile: ./digital_twin/Dockerfile
    container_name: smart_grid_digital_twin
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - LOG_LEVEL=INFO
    depends_on:
      mqtt:
        condition: service_healthy
    restart: always
    networks:
      - grid-net
    volumes:
      - ./logs/digital_twin:/app/logs

  self_healing:
    build:
      context: ./core
      dockerfile: ./self_healing/Dockerfile
    container_name: smart_grid_self_healing
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - LOG_LEVEL=INFO
    depends_on:
      mqtt:
        condition: service_healthy
      digital_twin:
        condition: service_started
    restart: always
    networks:
      - grid-net
    volumes:
      - ./logs/self_healing:/app/logs

  ai_detection:
    build:
      context: ./core
      dockerfile: ./ai_detection/Dockerfile
    container_name: smart_grid_ai_detection
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - LOG_LEVEL=INFO
    depends_on:
      mqtt:
        condition: service_healthy
      digital_twin:
        condition: service_started
    restart: always
    networks:
      - grid-net
    volumes:
      - ./logs/ai_detection:/app/logs

  # ═══════════════════════════════════════
  # FRONTEND
  # ═══════════════════════════════════════
  dashboard:
    build:
      context: ./dashboard
      dockerfile: ./Dockerfile
    container_name: smart_grid_dashboard
    ports:
      - "3001:80"
    depends_on:
      - gateway
    restart: always
    networks:
      - grid-net
    environment:
      - REACT_APP_API_URL=http://localhost:8000

