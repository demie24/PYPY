  assistant:
    build:
      context: ./core
      dockerfile: ./assistant/Dockerfile
    container_name: smart_grid_assistant
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - LOG_LEVEL=INFO
    depends_on:
      mqtt:
        condition: service_healthy
    restart: always
    networks:
      - grid-net
    volumes:
      - ./logs/assistant:/app/logs

  notification_service:
    build:
      context: ./core
      dockerfile: ./gateway/Dockerfile
    container_name: smart_grid_notification_service
    command: ["python", "gateway/notification_service.py"]
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
    depends_on:
