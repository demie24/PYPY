version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_grid_postgres
    environment:
      POSTGRES_DB: pypy_saas
      POSTGRES_USER: pypy_admin
      POSTGRES_PASSWORD: pypy_db_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pypy_admin -d pypy_saas"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - grid-net

  redis:
    image: redis:7-alpine
    container_name: smart_grid_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - grid-net

  mqtt:
    image: eclipse-mosquitto:latest
    container_name: smart_grid_mqtt
    ports:
      - "1884:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - grid-net

  gateway:
    build:
      context: ./core
      dockerfile: ./gateway/Dockerfile
    container_name: smart_grid_gateway
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://pypy_admin:pypy_db_secure_password@postgres:5432/pypy_saas
      - REDIS_URL=redis://redis:6379/0
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    restart: always
    networks:
      - grid-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery_worker:
    build:
      context: ./core
      dockerfile: ./gateway/Dockerfile
    container_name: smart_grid_celery_worker
    command: celery -A workers.simulation.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://pypy_admin:pypy_db_secure_password@postgres:5432/pypy_saas
      - REDIS_URL=redis://redis:6379/0
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - grid-net
    healthcheck:
      test: ["CMD", "celery", "-A", "workers.simulation.tasks", "inspect", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery_beat:
    build:
      context: ./core
      dockerfile: ./gateway/Dockerfile
    container_name: smart_grid_celery_beat
    command: celery -A workers.billing.tasks beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://pypy_admin:pypy_db_secure_password@postgres:5432/pypy_saas
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - grid-net
    healthcheck:
      test: ["CMD", "python", "-c", "import psutil, os, sys; sys.exit(0 if any('beat' in ' '.join(p.cmdline()) for p in psutil.process_iter() if p.pid != os.getpid()) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3

  digital_twin:
    build:
      context: ./core
      dockerfile: ./digital_twin/Dockerfile
    container_name: smart_grid_digital_twin
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - LOG_LEVEL=INFO
    depends_on:
      mqtt:
        condition: service_healthy
    restart: always
    networks:
      - grid-net
    volumes:
      - ./logs/digital_twin:/app/logs

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ./Dockerfile
    container_name: smart_grid_dashboard
    ports:
      - "3001:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: always
    networks:
      - grid-net
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  grid-net:
    driver: bridge

volumes:
  pgdata:
  mqtt_data:
  mqtt_logs:
