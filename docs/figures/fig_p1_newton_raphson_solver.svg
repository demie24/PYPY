<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 840" width="1050" height="840">
  <defs>
    <style>
      .title { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 17px; font-weight: bold; fill: #003366; text-anchor: middle; letter-spacing: 0.5px; }
      .caption { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 13.5px; font-weight: bold; fill: #1A252C; text-anchor: middle; }
      .layer-title { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 12px; font-weight: bold; fill: #003366; letter-spacing: 0.5px; }
      .box-title { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 12px; font-weight: bold; fill: #003366; text-anchor: middle; }
      .box-desc { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 10.5px; fill: #1A252C; text-anchor: middle; }
      .box-muted { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 9.5px; fill: #566573; text-anchor: middle; }
      .line-label { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 10px; font-weight: bold; fill: #1A5276; text-anchor: middle; }
      .layer-rect { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5px; stroke-dasharray: 4,4; rx: 6px; }
      .node-rect { fill: #FFFFFF; stroke: #003366; stroke-width: 1.75px; rx: 5px; }
      .node-fill { fill: #F1F5F9; stroke: #003366; stroke-width: 1.75px; rx: 5px; }
      .node-rhombus { fill: #EBF5FB; stroke: #003366; stroke-width: 1.75px; }
      .arrow-line { stroke: #2C3E50; stroke-width: 1.75px; fill: none; marker-end: url(#arrow); }
      .dashed-line { stroke: #1A5276; stroke-width: 1.5px; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2C3E50" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1A5276" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1050" height="840" fill="#FFFFFF" />
  <rect x="15" y="15" width="1020" height="810" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header Title -->
  <text x="525.0" y="45" class="title">NEWTON-RAPHSON AC POWER FLOW SOLVER WORKFLOW</text>
  <line x1="345.0" y1="54" x2="705.0" y2="54" stroke="#003366" stroke-width="1.5" />

  <!-- Content -->

    <!-- Flow Nodes Vertically Centered -->
    <rect x="400" y="90" width="250" height="60" class="node-rect" />
    <text x="525" y="125" class="box-title">Initialize IEEE Network</text>

    <rect x="400" y="190" width="250" height="60" class="node-rect-fill" />
    <text x="525" y="225" class="box-title">Update Breaker Status</text>

    <rect x="400" y="290" width="250" height="60" class="node-rect-fill" />
    <text x="525" y="325" class="box-title">Update Load Demand</text>

    <rect x="400" y="390" width="250" height="60" class="node-rect" />
    <text x="525" y="425" class="box-title">Construct Admittance Matrix (Y_bus)</text>

    <rect x="400" y="490" width="250" height="65" class="node-rect-fill" />
    <text x="525" y="520" class="box-title">Newton-Raphson Iteration</text>
    <text x="525" y="538" class="box-desc">Solve Mismatch &amp; Update Jacobian</text>

    <!-- Decision Diamond -->
    <polygon points="525,595 645,655 525,715 405,655" class="node-rhombus" />
    <text x="525" y="650" class="box-title">Converged?</text>
    <text x="525" y="668" class="box-desc">|ΔP|, |ΔQ| &lt; ε</text>

    <!-- Output Node -->
    <rect x="760" y="622.5" width="220" height="65" class="node-rect" />
    <text x="870" y="652" class="box-title">Generate Telemetry</text>
    <text x="870" y="670" class="box-desc">Broadcast V, θ, I, Loading</text>

    <!-- Connectors -->
    <path d="M 525 150 L 525 190" class="arrow-line" />
    <path d="M 525 250 L 525 290" class="arrow-line" />
    <path d="M 525 350 L 525 390" class="arrow-line" />
    <path d="M 525 450 L 525 490" class="arrow-line" />
    <path d="M 525 555 L 525 595" class="arrow-line" />

    <!-- Decision YES -->
    <path d="M 645 655 L 760 655" class="arrow-line" />
    <text x="700" y="645" class="line-label">YES</text>

    <!-- Decision NO (Loop back) -->
    <path d="M 405 655 L 260 655 L 260 522.5 L 400 522.5" class="arrow-line" />
    <text x="320" y="645" class="line-label">NO (Repeat Iteration)</text>


  <!-- Caption -->
  <text x="525.0" y="815" class="caption">Figure P.1 Newton-Raphson AC Power Flow Solver workflow.</text>
</svg>
