<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 850" width="1050" height="850">
  <defs>
    <style>
      .title { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 17px; font-weight: bold; fill: #003366; text-anchor: middle; letter-spacing: 0.5px; }
      .caption { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 13.5px; font-weight: bold; fill: #1A252C; text-anchor: middle; }
      .layer-title { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 12px; font-weight: bold; fill: #003366; letter-spacing: 0.5px; }
      .box-title { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 12px; font-weight: bold; fill: #003366; text-anchor: middle; }
      .box-desc { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 10.5px; fill: #1A252C; text-anchor: middle; }
      .box-muted { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 9.5px; fill: #566573; text-anchor: middle; }
      .line-label { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 10px; font-weight: bold; fill: #1A5276; text-anchor: middle; }
      .layer-rect { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5px; stroke-dasharray: 4,4; rx: 6px; }
      .node-rect { fill: #FFFFFF; stroke: #003366; stroke-width: 1.75px; rx: 5px; }
      .node-fill { fill: #F1F5F9; stroke: #003366; stroke-width: 1.75px; rx: 5px; }
      .node-rhombus { fill: #EBF5FB; stroke: #003366; stroke-width: 1.75px; }
      .arrow-line { stroke: #2C3E50; stroke-width: 1.75px; fill: none; marker-end: url(#arrow); }
      .dashed-line { stroke: #1A5276; stroke-width: 1.5px; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2C3E50" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1A5276" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1050" height="850" fill="#FFFFFF" />
  <rect x="15" y="15" width="1020" height="820" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header Title -->
  <text x="525.0" y="45" class="title">PPO SELF-HEALING DECISION LOOP</text>
  <line x1="345.0" y1="54" x2="705.0" y2="54" stroke="#003366" stroke-width="1.5" />

  <!-- Content -->

    <!-- Circular / Vertical Loop Stages -->
    <rect x="400" y="85" width="250" height="60" class="node-rect" />
    <text x="525" y="120" class="box-title">Grid State (s_t)</text>

    <rect x="400" y="175" width="250" height="60" class="node-rect-fill" />
    <text x="525" y="210" class="box-title">Observation</text>

    <rect x="400" y="265" width="250" height="60" class="node-rect" />
    <text x="525" y="300" class="box-title">Policy Network (π_θ)</text>

    <rect x="400" y="355" width="250" height="60" class="node-rect-fill" />
    <text x="525" y="390" class="box-title">Action Selection (a_t)</text>

    <rect x="400" y="445" width="250" height="60" class="node-rect" />
    <text x="525" y="480" class="box-title">Breaker Control</text>

    <rect x="400" y="535" width="250" height="60" class="node-rect-fill" />
    <text x="525" y="570" class="box-title">Grid Response</text>

    <rect x="400" y="625" width="250" height="60" class="node-rect" />
    <text x="525" y="660" class="box-title">Reward Calculation</text>

    <rect x="400" y="715" width="250" height="60" class="node-rect-fill" />
    <text x="525" y="750" class="box-title">Policy Update</text>

    <!-- Downward Arrows -->
    <path d="M 525 145 L 525 175" class="arrow-line" />
    <path d="M 525 235 L 525 265" class="arrow-line" />
    <path d="M 525 325 L 525 355" class="arrow-line" />
    <path d="M 525 415 L 525 445" class="arrow-line" />
    <path d="M 525 505 L 525 535" class="arrow-line" />
    <path d="M 525 595 L 525 625" class="arrow-line" />
    <path d="M 525 685 L 525 715" class="arrow-line" />

    <!-- Loop Back Arrow (Repeat) -->
    <path d="M 400 745 L 200 745 L 200 115 L 400 115" class="arrow-line" />
    <text x="140" y="430" class="line-label" transform="rotate(-90 140 430)">Repeat Decision Loop (Next Step s_t+1)</text>


  <!-- Caption -->
  <text x="525.0" y="825" class="caption">Figure R.1 PPO self-healing decision loop.</text>
</svg>
