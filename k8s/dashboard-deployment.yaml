apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-deployment
  namespace: default
  labels:
    app: pypy-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pypy-dashboard
  template:
    metadata:
      labels:
        app: pypy-dashboard
    spec:
      containers:
        - name: dashboard
          image: pypygrid/dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: default
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: pypy-dashboard
  type: ClusterIP
