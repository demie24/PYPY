
# PYPY MQTT Broker Configuration

# Development-safe local broker configuration

listener 1883 127.0.0.1

# Development mode:

# anonymous access allowed locally only

allow_anonymous true

# Persistence

persistence false

# Logging

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# WebSocket support for dashboard integration
listener 9001
protocol websockets
