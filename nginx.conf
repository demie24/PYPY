worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Global proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name pypygrid.com *.pypygrid.com;
        return 301 https://$host$request_uri;
    }

    # 1. Main Website & SaaS Dashboard (pypygrid.com / app.pypygrid.com)
    server {
        listen 443 ssl http2;
        server_name pypygrid.com app.pypygrid.com;

        ssl_certificate /etc/letsencrypt/live/pypygrid.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pypygrid.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://dashboard:80;
        }

        location /api {
            proxy_pass http://gateway:8000;
        }
    }

    # 2. API Gateway (api.pypygrid.com)
    server {
        listen 443 ssl http2;
        server_name api.pypygrid.com;

        ssl_certificate /etc/letsencrypt/live/pypygrid.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pypygrid.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://gateway:8000;
        }
    }

    # 3. Documentation, Research Portal & Status (Mock / Redirect to main site)
    server {
        listen 443 ssl http2;
        server_name docs.pypygrid.com research.pypygrid.com status.pypygrid.com;

        ssl_certificate /etc/letsencrypt/live/pypygrid.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pypygrid.com/privkey.pem;

        location / {
            return 302 https://pypygrid.com/docs;
        }
    }
}
